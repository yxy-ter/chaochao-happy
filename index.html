<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕快乐 💙</title>
    <style>
        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 40%, #2d6a9f 70%, #4a9fd4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 垂直居中 */
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden; /* 防止整个页面滚动 */
            color: #fff;
            position: relative;
        }

        /* 鲸鱼背景装饰 */
        .whale-bg {
            position: fixed; bottom: -50px; right: -50px;
            font-size: 300px; opacity: 0.1;
            transform: rotate(-20deg);
            z-index: 0; pointer-events: none;
        }

        /* 主容器 */
        .container {
            position: relative; z-index: 10;
            width: 90%; max-width: 450px;
            text-align: center;
            padding: 20px;
        }

        /* 标题部分 */
        h1 {
            font-size: 2.5rem; margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(74, 159, 212, 0.8);
            animation: fadeInDown 1s ease-out;
        }
        
        .subtitle {
            font-size: 1rem; opacity: 0.9; margin-bottom: 30px;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        /* 信件卡片核心样式 - 修复滑动的关键 */
        .letter-card {
            background: rgba(255, 255, 255, 0.95); /* 稍微提高不透明度，遮罩背景 */
            border-radius: 20px;
            padding: 25px 20px;
            color: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            
            /* 关键修改：限制高度并允许内部滚动 */
            height: 60vh; /* 占据屏幕高度的60%，留出上下空间 */
            overflow-y: auto; /* 开启垂直滚动 */
            
            /* 美化滚动条（Webkit内核浏览器） */
            scrollbar-width: thin; 
            scrollbar-color: #4a9fd4 transparent;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s backwards;
        }

        /* 针对手机浏览器的滚动条隐藏/美化 */
        .letter-card::-webkit-scrollbar { width: 6px; }
        .letter-card::-webkit-scrollbar-track { background: transparent; }
        .letter-card::-webkit-scrollbar-thumb { background-color: #b3d4fc; border-radius: 10px; }

        .letter-text {
            font-size: 1.05rem; line-height: 1.8; text-align: left;
            white-space: pre-wrap; /* 保留换行符 */
        }

        /* 视频按钮区域 */
        .video-section {
            margin-top: 30px;
            opacity: 0; visibility: hidden; /* 默认隐藏 */
            transition: all 0.5s ease;
            transform: translateY(20px);
        }

        .video-btn {
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none; padding: 12px 30px; border-radius: 50px;
            color: #d64758; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s;
        }
        .video-btn:active { transform: scale(0.95); }

        /* 视频弹窗 */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .video-wrapper {
            width: 90%; max-width: 600px; position: relative;
            background: #000; border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 50px rgba(74, 159, 212, 0.5);
        }
        video { width: 100%; display: block; }
        
        .close-btn {
            position: absolute; top: -40px; right: 0;
            color: white; font-size: 30px; cursor: pointer;
        }

        /* 动画定义 */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="whale-bg">🐋</div>

    <div class="container">
        <!-- 头部标题 -->
        <h1>七夕快乐 💙</h1>
        <p class="subtitle">致最可爱的你，愿每一天都如鲸鱼般自由快乐</p >

        <!-- 信件区域 (可滑动) -->
        <div class="letter-card" id="letterCard">
            <div class="letter-text">
                亲爱的：

                展信佳。

                在这个特别的日子里，想对你说些平时不好意思开口的话。
                
                其实，在那些有些疲惫的日子里，是因为看到了你，我才重新找到了前行的力量。看着你在镜头前努力的样子，看着你一步步变成更好的模样，我也在心底悄悄许下愿望：我要像你一样，努力提升自己，让自己变得更好。

                谢谢你成为我的光。未来的日子，我们都要在各自的领域里，像鲸鱼一样，自由、坚定地游向更深的海。

                七夕快乐，愿你永远可爱，永远热泪盈眶，永远在这个世界闪闪发光。

                爱你的：[你的名字]
                202X年七夕
            </div>
        </div>

        <!-- 视频按钮 -->
        <div class="video-section" id="videoSection">
            <button class="video-btn" onclick="openVideo()">🎬 点击查看专属惊喜</button>
        </div>
    </div>

    <!-- 视频弹窗 -->
    <div class="modal" id="videoModal">
        <div class="video-wrapper">
            <div class="close-btn" onclick="closeVideo()">×</div>
            <!-- 注意：这里替换成你的视频文件名，例如 video.mp4 -->
            <video id="myVideo" controls playsinline>
                <source src="video.mp4" type="video/mp4">
                您的浏览器不支持播放视频。
            </video>
        </div>
    </div>

    <!-- 背景音乐 (已优化为OGG) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bgm.ogg" type="audio/ogg">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 交互逻辑
        
        // 1. 监听信件滚动到底部，显示视频按钮
        const letterCard = document.getElementById('letterCard');
        const videoSection = document.getElementById('videoSection');
        let musicStarted = false;

        // 尝试自动播放音乐（部分浏览器需要用户交互）
        document.body.addEventListener('click', function() {
            if (!musicStarted) {
                document.getElementById('bgMusic').play().catch(e => console.log("等待交互播放音乐"));
                musicStarted = true;
            }
        }, { once: true });

        // 监听滚动事件
        letterCard.addEventListener('scroll', function() {
            // 计算是否滚动到底部 (允许20px的误差)
            const scrollTop = letterCard.scrollTop;
            const scrollHeight = letterCard.scrollHeight;
            const clientHeight = letterCard.clientHeight;

            if (scrollTop + clientHeight >= scrollHeight - 20) {
                // 显示视频按钮
                videoSection.style.opacity = '1';
                videoSection.style.visibility = 'visible';
                videoSection.style.transform = 'translateY(0)';
            }
        });

        // 2. 视频弹窗控制
        const modal = document.getElementById('videoModal');
        const video = document.getElementById('myVideo');

        function openVideo() {
            modal.classList.add('active');
            video.play();
        }

        function closeVideo() {
            modal.classList.remove('active');
            video.pause();
            video.currentTime = 0; // 重置视频进度
        }

        // 点击遮罩层也可以关闭
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeVideo();
            }
        });
    </script>
</body>
</html>
