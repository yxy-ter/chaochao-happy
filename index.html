<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕快乐 💙</title>
    <style>
        /* --- 基础设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            /* 恢复原本的深蓝渐变背景 */
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 40%, #2d6a9f 70%, #4a9fd4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
            overflow-x: hidden; /* 防止横向滚动条 */
            position: relative;
        }

        /* --- 背景装饰 (鲸鱼与气泡) --- */
        .bg-decoration {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        
        /* 模拟鲸鱼剪影 (用CSS绘制一个抽象的，或者你可以换回图片) */
        .whale {
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50% 50% 0 0;
            filter: blur(20px);
            animation: floatWhale 10s infinite ease-in-out alternate;
        }
        
        @keyframes floatWhale {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }

        /* 气泡动画 */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise 8s infinite ease-in;
        }
        .bubble:nth-child(1) { width: 20px; height: 20px; left: 10%; animation-duration: 6s; }
        .bubble:nth-child(2) { width: 30px; height: 30px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 15px; height: 15px; left: 70%; animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(4) { width: 40px; height: 40px; left: 90%; animation-duration: 9s; animation-delay: 3s; }

        @keyframes rise {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        /* --- 内容容器 --- */
        .container {
            width: 90%;
            max-width: 450px;
            padding: 20px 0 80px 0; /* 底部留白 */
            z-index: 10;
        }

        /* --- 标题区 --- */
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { font-size: 28px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.3); letter-spacing: 2px; }
        .header p { font-size: 14px; opacity: 0.8; margin-top: 5px; letter-spacing: 1px; }

        /* --- 视频轮播区 (修复版) --- */
        .video-section {
            width: 100%;
            margin-bottom: 40px;
            position: relative;
        }
        
        .video-title {
            font-size: 18px;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #4a9fd4;
            font-weight: bold;
        }

        .video-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding-bottom: 10px;
            /* 隐藏滚动条 */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .video-slider::-webkit-scrollbar { display: none; }

        .video-card {
            flex: 0 0 100%; /* 每个视频占满宽度 */
            scroll-snap-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 9/16; /* 竖屏视频比例 */
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 播放按钮遮罩 */
        .play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transition: opacity 0.3s;
        }
        .play-btn {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }
        .play-btn::after {
            content: '';
            display: block;
            width: 0; height: 0;
            border-style: solid;
            border-width: 10px 0 10px 18px;
            border-color: transparent transparent transparent #fff;
            margin-left: 5px; /* 视觉居中修正 */
        }

        /* --- 信纸区 (找回来了！) --- */
        .letter-section {
            width: 100%;
            perspective: 1000px;
        }

        .envelope {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            max-height: 400px; /* 限制高度，超出滚动 */
            overflow-y: auto; /* 允许纵向滚动 */
            
            /* 自定义滚动条样式 */
            scrollbar-width: thin;
            scrollbar-color: #ccc transparent;
        }
        
        /* 针对webkit内核浏览器的滚动条 */
        .envelope::-webkit-scrollbar { width: 6px; }
        .envelope::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 3px; }

        .letter-content {
            font-size: 16px;
            line-height: 1.8;
            text-align: justify;
        }
        
        .letter-content p { margin-bottom: 15px; }
        
        .signature {
            text-align: right;
            margin-top: 30px;
            font-weight: bold;
            font-family: 'Cursive', serif; /* 尝试手写体风格 */
        }

        /* 提示文字 */
        .scroll-hint {
            text-align: center;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 10px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="bg-decoration">
        <div class="whale"></div> <!-- 抽象鲸鱼 -->
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>七夕快乐 💙</h1>
            <p>致我最爱的女孩</p >
        </div>

        <!-- 视频部分 -->
        <div class="video-section">
            <div class="video-title">🎬 我们的时光</div>
            <div class="video-slider">
                <!-- 视频1 -->
                <div class="video-card" onclick="togglePlay(this)">
                    <video src="video1.mp4" loop playsinline webkit-playsinline></video>
                    <div class="play-overlay"><div class="play-btn"></div></div>
                </div>
                <!-- 视频2 -->
                <div class="video-card" onclick="togglePlay(this)">
                    <video src="video2.mp4" loop playsinline webkit-playsinline></video>
                    <div class="play-overlay"><div class="play-btn"></div></div>
                </div>
            </div>
            <div class="scroll-hint">左右滑动查看更多 ></div>
        </div>

        <!-- 信件部分 -->
        <div class="letter-section">
            <div class="video-title">💌</div>
            <div class="envelope">
                <div class="letter-content">
                      <p>
                闪闪发光的超超💖：
                  
                展信佳。
                  
                其实一直想告诉你，在那些平凡甚至有些疲惫的日子里，是因为看到了你，我才重新找到了前行的力量。
                  
                看着你在镜头前努力的样子，看着你一步步变成更好的模样，我也在心底悄悄许下愿望：<b>我要像你一样，努力提升自己，让自己变得更好。</b>
                  
                谢谢你成为我的光。未来的日子，我们都要在各自的领域里，像鲸鱼一样，自由、坚定地游向更深的海。
                  
                七夕快乐，愿你永远可爱，永远热泪盈眶，永远在这个世界闪闪发光。
                  
                <div style="text-align:right; margin-top:20px;">
               爱你的：星💫-100% 
                    2026年七夕
                </div>
            </p >
            
            </div>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" src="bgm.ogg" loop></audio>
    <!-- 备用MP3源，如果ogg不行会自动尝试这个（如果文件存在） -->
    <!-- <source src="bgm.mp3" type="audio/mpeg"> -->

    <script>
        // 背景音乐控制
        const bgm = document.getElementById('bgm');
        // 尝试自动播放（可能会被浏览器拦截，需要用户交互）
        document.body.addEventListener('click', function() {
            bgm.play().catch(e => console.log("等待用户交互播放音乐"));
        }, { once: true });

        // 视频点击播放逻辑
        function togglePlay(card) {
            const video = card.querySelector('video');
            const overlay = card.querySelector('.play-overlay');
            
            // 暂停其他所有视频
            document.querySelectorAll('video').forEach(v => {
                if (v !== video) {
                    v.pause();
                    v.parentElement.querySelector('.play-overlay').style.opacity = '1';
                }
            });

            if (video.paused) {
                video.play();
                overlay.style.opacity = '0'; // 隐藏遮罩
                overlay.style.pointerEvents = 'none'; // 让点击穿透，方便点击视频暂停
            } else {
                video.pause();
                overlay.style.opacity = '1'; // 显示遮罩
                overlay.style.pointerEvents = 'auto';
            }
        }
    </script>
</body>
</html>
