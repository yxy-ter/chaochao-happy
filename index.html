<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕快乐 💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 40%, #2d6a9f 70%, #4a9fd4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
            padding-bottom: 50px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .header { text-align: center; margin-bottom: 20px; z-index: 10; }
        .header h1 { font-size: 2.5rem; text-shadow: 0 0 15px rgba(74,159,212,0.8); margin-bottom: 10px; }
        .header p { font-size: 1rem; opacity: 0.9; max-width: 80%; margin: 0 auto; line-height: 1.5; }

        /* 信纸容器 */
        .letter-card {
            background: rgba(255,255,255,0.95);
            width: 90%; max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #333; z-index: 10;
            height: 55vh;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* 滚动文字区 */
        .letter-content {
            flex: 1; overflow-y: auto;
            padding: 30px 25px 60px 25px; /* 底部多留空间，防止文字被箭头遮挡 */
            font-size: 1.05rem; line-height: 1.8; text-align: justify;
            scrollbar-width: thin;
            scrollbar-color: rgba(45,106,159,0.3) transparent;
        }
        .letter-content::-webkit-scrollbar { width: 6px; }
        .letter-content::-webkit-scrollbar-track { background: transparent; }
        .letter-content::-webkit-scrollbar-thumb { background-color: rgba(45,106,159,0.3); border-radius: 10px; }

        /* 滑动提示箭头 */
        .scroll-hint {
            position: absolute;
            bottom: 12px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center;
            gap: 4px;
            animation: hintPulse 2s ease-in-out infinite;
            transition: opacity 0.5s ease;
            pointer-events: none; /* 不阻挡滑动 */
            z-index: 20;
        }
        .scroll-hint span {
            font-size: 12px; color: #2d6a9f; opacity: 0.7;
        }
        .scroll-hint .arrow {
            width: 20px; height: 20px;
            border-right: 2px solid #2d6a9f;
            border-bottom: 2px solid #2d6a9f;
            transform: rotate(45deg);
            opacity: 0.6;
        }
        /* 滑到底后隐藏箭头 */
        .scroll-hint.hidden { opacity: 0; }

        @keyframes hintPulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) translateY(0); }
            50% { opacity: 0.4; transform: translateX(-50%) translateY(6px); }
        }

        /* 按钮区 */
        .action-area { margin-top: 30px; z-index: 10; width: 100%; display: flex; justify-content: center; }
        .btn {
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none; padding: 15px 40px; border-radius: 50px;
            color: #fff; font-size: 1.1rem; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255,154,158,0.4);
            cursor: pointer; transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        /* 视频弹窗 */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .video-container {
            width: 90%; max-width: 600px; aspect-ratio: 16/9;
            background: #000; border-radius: 10px; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        .close-btn {
            margin-top: 20px; background: transparent;
            border: 1px solid #fff; color: #fff;
            padding: 8px 20px; border-radius: 20px; cursor: pointer;
        }

        /* 背景鲸鱼 */
        .whale-bg {
            position: fixed; bottom: -50px; right: -50px;
            font-size: 300px; opacity: 0.1; pointer-events: none; z-index: 1;
            transform: rotate(-10deg);
        }
    </style>
</head>
<body>

    <div class="whale-bg">🐋</div>

    <div class="header">
        <h1>七夕快乐 💙</h1>
        <p>致最可爱的你，愿每一天都如鲸鱼般自由快乐</p >
    </div>

    <div class="letter-card">
        <div class="letter-content" id="letterContent">
            <p>
                闪闪发光的超超💖：
                  
                展信佳。
                  
                其实一直想告诉你，在那些平凡甚至有些疲惫的日子里，是因为看到了你，我才重新找到了前行的力量。
                  
                看着你在镜头前努力的样子，看着你一步步变成更好的模样，我也在心底悄悄许下愿望：<b>我要像你一样，努力提升自己，让自己变得更好。</b>
                  
                谢谢你成为我的光。未来的日子，我们都要在各自的领域里，像鲸鱼一样，自由、坚定地游向更深的海。
                  
                七夕快乐，愿你永远可爱，永远热泪盈眶，永远在这个世界闪闪发光。
                  
                <div style="text-align:right; margin-top:20px;">
               爱你的：星💫-100% 
                    2026年七夕
                </div>
            </p >
        </div>
        <!-- 滑动提示 -->
        <div class="scroll-hint" id="scrollHint">
            <span>向下滑动</span>
            <div class="arrow"></div>
        </div>
    </div>

    <div class="action-area">
        <button class="btn" onclick="openVideo()">查收我的视频礼物 🎁</button>
    </div>

    <div class="video-modal" id="videoModal">
        <div class="video-container">
            <video id="myVideo" controls playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>
        <button class="close-btn" onclick="closeVideo()">关闭视频</button>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="bgm.ogg" type="audio/ogg">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 背景音乐
        let musicStarted = false;
        document.body.addEventListener('click', function() {
            if (!musicStarted) {
                document.getElementById('bgMusic').volume = 0.3;
                document.getElementById('bgMusic').play().catch(() => {});
                musicStarted = true;
            }
        }, { once: true });

        // 滑动提示：滑到底自动隐藏
        const letterContent = document.getElementById('letterContent');
        const scrollHint = document.getElementById('scrollHint');

        letterContent.addEventListener('scroll', function() {
            const { scrollTop, scrollHeight, clientHeight } = letterContent;
            if (scrollTop + clientHeight >= scrollHeight - 30) {
                scrollHint.classList.add('hidden');
            } else {
                scrollHint.classList.remove('hidden');
            }
        });

        // 视频控制
        const modal = document.getElementById('videoModal');
        const video = document.getElementById('myVideo');

        function openVideo() {
            modal.style.display = 'flex';
            video.play().catch(() => {});
        }
        function closeVideo() {
            modal.style.display = 'none';
            video.pause();
            video.currentTime = 0;
        }
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeVideo();
        });
    </script>
</body>
</html>
