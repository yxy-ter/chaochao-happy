<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕快乐 💙</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 40%, #2d6a9f 70%, #4a9fd4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 80px; /* 底部留白，防止按钮被手机边缘遮挡 */
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* 标题区 */
        .header { text-align: center; margin-bottom: 25px; z-index: 10; margin-top: 10px; }
        .header h1 { font-size: 2.2rem; text-shadow: 0 0 15px rgba(74,159,212,0.8); margin-bottom: 10px; }
        .header p { font-size: 1rem; opacity: 0.9; line-height: 1.6; max-width: 300px; margin: 0 auto; }

        /* 信纸卡片 */
        .letter-card {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            height: 45vh; /* 限制高度，强制内部滚动 */
        }
        
        .letter-content {
            padding: 30px 25px 50px 25px; /* 底部多留空间，防止文字被箭头遮挡 */
            height: 100%;
            overflow-y: auto; /* 开启纵向滚动 */
            line-height: 1.8;
            font-size: 1rem;
            text-align: justify;
            scrollbar-width: none; /* Firefox 隐藏滚动条 */
        }
        .letter-content::-webkit-scrollbar { display: none; } /* Chrome/Safari 隐藏滚动条 */

        /* 滑动提示箭头 */
        .scroll-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #4a9fd4;
            font-size: 1.5rem;
            animation: bounce 1.5s infinite;
            pointer-events: none; /* 让点击穿透 */
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
            50% { transform: translate(-50%, 8px); opacity: 1; }
        }

        /* 视频区域标题 */
        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #4a9fd4;
            font-weight: bold;
            z-index: 10;
        }

        /* 视频横向滑动容器 */
        .video-scroll-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-snap-type: x mandatory; /* 滑动吸附效果 */
            scrollbar-width: none;
        }
        .video-scroll-container::-webkit-scrollbar { display: none; }

        .video-card {
            flex: 0 0 100%; /* 每个视频占满宽度 */
            scroll-snap-align: center;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        video {
            width: 100%;
            display: block;
        }

        /* 底部按钮 */
        .action-btn {
            margin-top: 30px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 154, 158, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }
        .action-btn:active { transform: scale(0.95); }

        /* 装饰背景 */
        .whale-bg {
            position: fixed; bottom: -50px; right: -50px;
            font-size: 15rem; opacity: 0.1; pointer-events: none; z-index: 0;
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="whale-bg">🐋</div>

    <!-- 头部 -->
    <div class="header">
        <h1>七夕快乐 💙</h1>
        <p>致最可爱的你，愿每一天都如鲸鱼般自由快乐</p >
    </div>

    <!-- 信纸区域 -->
    <div class="letter-card">
        <div class="letter-content" id="letterText">
             <p>
                闪闪发光的超超💖：
                  
                展信佳。
                  
                其实一直想告诉你，在那些平凡甚至有些疲惫的日子里，是因为看到了你，我才重新找到了前行的力量。
                  
                看着你在镜头前努力的样子，看着你一步步变成更好的模样，我也在心底悄悄许下愿望：<b>我要像你一样，努力提升自己，让自己变得更好。</b>
                  
                谢谢你成为我的光。未来的日子，我们都要在各自的领域里，像鲸鱼一样，自由、坚定地游向更深的海。
                  
                七夕快乐，愿你永远可爱，永远热泪盈眶，永远在这个世界闪闪发光。
                  
                <div style="text-align:right; margin-top:20px;">
               爱你的：星💫-100% 
                    2026年七夕
                </div>
            </p >
        </div>
        <!-- 呼吸箭头提示 -->
        <div class="scroll-hint" id="scrollHint">⬇</div>
    </div>

    <!-- 视频回忆区域 -->
    <div class="section-title">🎬 我们的时光</div>
    <div class="video-scroll-container">
        <!-- 视频 1：专属回忆 -->
        <div class="video-card">
            <video controls playsinline>
                <source src="video1.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
        </div>
        <!-- 视频 2：闪闪发光的你 -->
        <div class="video-card">
            <video controls playsinline>
                <source src="video2.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
        </div>
    </div>

    <!-- 底部按钮 -->
    <button class="action-btn" onclick="alert('我超爱你！💙')">接收我的心意 💌</button>

    <!-- 背景音乐：优先加载 OGG 格式，更流畅 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bgm.ogg" type="audio/ogg">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. 背景音乐自动播放（需用户点击屏幕任意位置触发）
        let musicStarted = false;
        document.body.addEventListener('click', function() {
            if (!musicStarted) {
                const bgMusic = document.getElementById('bgMusic');
                bgMusic.volume = 0.3; // 音量调到30%，不抢戏
                bgMusic.play().catch(() => {});
                musicStarted = true;
            }
        }, { once: true });

        // 2. 滑动提示：当用户开始滑动信纸时，隐藏向下箭头
        const letterContent = document.getElementById('letterText');
        const scrollHint = document.getElementById('scrollHint');

        letterContent.addEventListener('scroll', () => {
            if (letterContent.scrollTop > 10) {
                scrollHint.style.opacity = '0';
            } else {
                scrollHint.style.opacity = '0.8';
            }
        });
    </script>
</body>
</html>
